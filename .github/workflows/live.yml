name: Live checks

# Checks the published repo on GitHub itself: what validate.yml can't see
# from a checkout. Runs after every change to main, weekly in case GitHub's
# behaviour changes, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      file-test-issues:
        description: File, check and close one test issue per form
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    name: Live checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      CONSUMER_REPO: ${{ vars.E2E_CONSUMER_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Repo is public
        run: python scripts/check-live.py visibility

      - name: Raw URLs serve plain text
        run: python scripts/check-live.py raw-urls

      - name: GitHub loads every form
        run: python scripts/check-live.py templates "$GITHUB_REPOSITORY"

      - name: Consumer repo inherits the forms
        if: env.CONSUMER_REPO != ''
        run: python scripts/check-live.py templates "$CONSUMER_REPO"

      - name: Label sync is idempotent
        run: |
          scripts/sync-labels.sh "$GITHUB_REPOSITORY"
          second="$(scripts/sync-labels.sh "$GITHUB_REPOSITORY")"
          echo "$second"
          if grep -v ': 0 label(s) created or updated$' <<<"$second"; then
            echo "::error::Second sync run changed labels; sync-labels.sh is not idempotent"
            exit 1
          fi

      - name: Labels match labels.yml
        run: python scripts/check-live.py labels

      - name: Issues filed outside the form match the contract
        if: github.event_name == 'workflow_dispatch' && inputs.file-test-issues
        run: python scripts/check-live.py round-trip
