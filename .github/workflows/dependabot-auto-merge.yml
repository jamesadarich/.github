name: Dependabot auto-merge

# Turns on auto-merge (squash) for Dependabot's patch and minor updates.
# GitHub then merges the PR once the checks required on main pass. Major
# updates are left open for review.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'jamesadarich/.github'
    steps:
      - name: Read update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ github.token }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}

      - name: Leave major updates for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major update (${UPDATE}); left open for review."
        env:
          UPDATE: ${{ steps.metadata.outputs.dependency-names }}
